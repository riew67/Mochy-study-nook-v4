        function getTodayInfo() {
            const now = new Date();
            const dayName = dayNames[now.getDay()];
            const dateStr = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            const isoDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            return { dayName, dateStr, isoDate };
        }

        const todayInfo = getTodayInfo();
        let currentDay = todayInfo.dayName;
        let activeTab = 'plan';
        let streakCount = parseInt(localStorage.getItem('mochi_streak') || '0', 10);
        let lastAbsenDate = localStorage.getItem('mochi_last_absen') || '';
        let taskState = JSON.parse(localStorage.getItem('mochi_task_state') || '{}');

        // TIMER LOGIC (REAL-TIME 30 MINS)
        let timerInterval = null;
        let timerSeconds = 1800; // 30 Menit = 1800 detik

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                if (timerSeconds > 0) {
                    timerSeconds--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    alert("🎉 Sesi belajar 30 menit selesai! Kerja bagus, istirahat sejenak yuk! 🐰✨");
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer();
            timerSeconds = 1800;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const display = document.getElementById('timerDisplay');
            if (!display) return;
            const minutes = Math.floor(timerSeconds / 60);
            const seconds = timerSeconds % 60;
            display.innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function copyToClipboard(text) {
            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            alert('✨ Template email berhasil disalin ke clipboard!');
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'en-US';
                window.speechSynthesis.speak(msg);
            } else {
                alert('Browser kamu tidak mendukung audio speech.');
            }
        }

        function checkAnswer(selectedIdx, correctIdx) {
            if (selectedIdx === correctIdx) {
                alert('🎉 Richtig! (Benar sekali! Keren banget!)');
            } else {
                alert('❌ Falsch! (Belum tepat, coba pilih jawaban lain ya!)');
            }
        }

        window.onload = function() {
            updateHeaderAndBanner();
            renderTabs();
            renderTabContent();
        };

        function updateHeaderAndBanner() {
            const data = weeklyData[currentDay];
            document.getElementById('currentDayTitle').innerText = `${data.theme} (Hari Ini)`;
            document.getElementById('todayDateBadge').innerText = todayInfo.dateStr;
            document.getElementById('streakDisplay').innerText = streakCount + ' Hari';
        }

        function handleAbsen() {
            const currentIso = todayInfo.isoDate;

            if (lastAbsenDate === currentIso) {
                alert(`✨ Kamu sudah melakukan absen untuk hari ini (${todayInfo.dateStr})!\n\nStreak kamu saat ini: ${streakCount} Hari.`);
                return;
            }

            if (lastAbsenDate) {
                const lastDateObj = new Date(lastAbsenDate);
                const todayObj = new Date(currentIso);
                const diffTime = Math.abs(todayObj - lastDateObj);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    streakCount += 1;
                } else if (diffDays > 1) {
                    alert(`ℹ️ Terdeteksi ada hari yang terlewat. Jangan berkecil hati! Streak di-reset ke 1 Hari dan siap mulai lagi hari ini! 💪✨`);
                    streakCount = 1;
                }
            } else {
                streakCount = 1;
            }

            lastAbsenDate = currentIso;
            localStorage.setItem('mochi_streak', streakCount.toString());
            localStorage.setItem('mochi_last_absen', lastAbsenDate);

            updateHeaderAndBanner();
            renderTabContent();

            alert(`🎉 Hore! Absen berhasil untuk hari ini (${todayInfo.dateStr})!\n\nStreak kamu sekarang: ${streakCount} Hari! Tetap semangat! 🔥`);
        }

        function renderTabs() {
            const tabs = [
